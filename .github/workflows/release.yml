name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 5.0.4.jdk17.1)'
        required: true
        type: string
      base_branch:
        description: 'Base branch to create release from (e.g., main, master, 5.0.3)'
        required: false
        type: string
        default: 'main'
      branch_name:
        description: 'Branch name for release (e.g., release/5.0.4)'
        required: true
        type: string
      release_tag:
        description: 'Git tag for release (e.g., 5.0.4.jdk17.1)'
        required: true
        type: string
      create_release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: true
      publish_packages:
        description: 'Publish to GitHub Packages'
        required: false
        type: boolean
        default: true
      deploy_to_maven_central:
        description: 'Publish every module to Maven Central (io.github.martinhickson)'
        required: false
        default: true
        type: boolean
      central_group_id:
        description: 'Maven groupId for Maven Central (verified namespace)'
        required: false
        default: 'io.github.martinhickson'
        type: string
      run_tests:
        description: 'Run tests before publishing'
        required: false
        default: false
        type: boolean

env:
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false
  MAVEN_CACHE: ${{ github.workspace }}/.m2

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        run: |
          BASE_BRANCH="${{ github.event.inputs.base_branch }}"
          BRANCH_NAME="${{ github.event.inputs.branch_name }}"
          
          # Fetch all branches
          git fetch origin
          
          # Checkout base branch
          if git ls-remote --heads origin "$BASE_BRANCH" | grep -q "$BASE_BRANCH"; then
            echo "Checking out base branch: $BASE_BRANCH"
            git checkout "$BASE_BRANCH"
            git pull origin "$BASE_BRANCH"
          else
            echo "Warning: Base branch $BASE_BRANCH not found, using current branch"
          fi
          
          # Create or checkout release branch
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "Branch $BRANCH_NAME already exists, checking it out"
            git checkout "$BRANCH_NAME"
            git pull origin "$BRANCH_NAME"
          else
            echo "Creating new branch $BRANCH_NAME from $BASE_BRANCH"
            git checkout -b "$BRANCH_NAME"
            git push -u origin "$BRANCH_NAME"
          fi

      - name: Update version in all POM files
        run: |
          VERSION="${{ github.event.inputs.version }}"
          mvn -B -ntp versions:set -DnewVersion="${VERSION}" -DprocessAllModules=true -DgenerateBackupPoms=false
          # versions:set must not retarget the external jboss-parent pin
          python3 - << 'PY'
          from pathlib import Path
          import re
          pom = Path('pom.xml')
          text = pom.read_text()
          text2 = re.sub(
              r'(<artifactId>jboss-parent</artifactId>\s*<version>)[^<]+(</version>)',
              r'\g<1>24\g<2>',
              text,
              count=1,
          )
          if text2 != text:
              pom.write_text(text2)
              print('restored jboss-parent version 24')
          else:
              print('jboss-parent version left unchanged')
          PY
          if grep -q '<tag>' pom.xml; then
            sed -i "s|<tag>.*</tag>|<tag>${VERSION}</tag>|" pom.xml
          fi
          echo "Version update complete"

      - name: Commit version changes
        run: |
          git add -A
          git commit -m "Update version to ${{ github.event.inputs.version }}" || echo "No changes to commit"
          git push

      - name: Build project
        run: |
          mvn clean install -Dmaven.test.skip=true

      - name: Run tests
        if: github.event.inputs.run_tests == 'true'
        run: |
          mvn test

      - name: Package artifacts
        run: |
          mvn package -Dmaven.test.skip=true

      - name: Configure Maven for GitHub Packages
        if: github.event.inputs.publish_packages == 'true'
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                    http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Configure distributionManagement in POMs
        if: github.event.inputs.publish_packages == 'true'
        run: |
          REPO_URL="https://maven.pkg.github.com/${{ github.repository }}"
          
          # Add distributionManagement to root pom.xml if not exists
          if ! grep -q "<distributionManagement>" pom.xml; then
            sed -i '/<\/project>/i\
            <distributionManagement>\
                <repository>\
                    <id>github</id>\
                    <name>GitHub ${{ github.repository_owner }} Apache Maven Packages</name>\
                    <url>'"${REPO_URL}"'</url>\
                </repository>\
            </distributionManagement>
            ' pom.xml
          fi

      - name: Publish to GitHub Packages
        if: github.event.inputs.publish_packages == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mvn deploy -Dmaven.test.skip=true \
            -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }} | tee /tmp/gh-deploy.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            if grep -q 'status code: 409' /tmp/gh-deploy.log; then
              echo "Already on GitHub Packages"
            else
              exit "$code"
            fi
          fi

      - name: Publish every module to Maven Central
        if: github.event.inputs.deploy_to_maven_central == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_CENTRAL_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
          MAVEN_CENTRAL_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
          CENTRAL_GROUP_ID: ${{ github.event.inputs.central_group_id }}
        run: |
          set -euo pipefail
          if [ -z "${MAVEN_CENTRAL_USERNAME}" ] || [ -z "${MAVEN_CENTRAL_PASSWORD}" ] || [ -z "${MAVEN_CENTRAL_GPG_PRIVATE_KEY}" ]; then
            echo "::error::Maven Central publishing is not configured."
            exit 1
          fi
          python3 - << 'PY'
          import pathlib, shutil
          backup = pathlib.Path('/tmp/pom-backup')
          if backup.exists():
              shutil.rmtree(backup)
          for pom in pathlib.Path('.').rglob('pom.xml'):
              if '.git' in pom.parts or 'target' in pom.parts:
                  continue
              dest = backup / pom
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(pom, dest)
          PY
          chmod +x .github/scripts/rewrite-group-id.sh
          .github/scripts/rewrite-group-id.sh org.picketbox "${CENTRAL_GROUP_ID}"
          python3 - << 'PY'
          import os, pathlib, re
          group = os.environ["CENTRAL_GROUP_ID"]
          pat = re.compile(r'<groupId>org\.jboss\.security</groupId>(\s*)<artifactId>jbossxacml</artifactId>')
          commons = re.compile(
              r'<groupId>' + re.escape(group) + r'</groupId>(\s*)<artifactId>picketbox-commons</artifactId>'
          )
          def repl(match):
              return f'<groupId>{group}</groupId>{match.group(1)}<artifactId>jbossxacml</artifactId>'
          def keep_commons(match):
              return f'<groupId>org.picketbox</groupId>{match.group(1)}<artifactId>picketbox-commons</artifactId>'
          for pom in pathlib.Path('.').rglob('pom.xml'):
              if '.git' in pom.parts or 'target' in pom.parts:
                  continue
              text = pom.read_text()
              new = commons.sub(keep_commons, pat.sub(repl, text))
              if new != text:
                  pom.write_text(new)
                  print('rewrote external coordinates in', pom)
          PY
          mkdir -p ~/.m2
          if [ ! -f ~/.m2/settings.xml ]; then
            printf '%s\n' '<settings><servers></servers></settings>' > ~/.m2/settings.xml
          fi
          sed -i "/<\/servers>/i\\
              <server>\\
                <id>central</id>\\
                <username>${MAVEN_CENTRAL_USERNAME}</username>\\
                <password>${MAVEN_CENTRAL_PASSWORD}</password>\\
              </server>" ~/.m2/settings.xml
          echo "${MAVEN_CENTRAL_GPG_PRIVATE_KEY}" | gpg --batch --import --pinentry-mode loopback
          mvn -B -ntp deploy -Pcentral-release -Dmaven.test.skip=true \
            -Dmaven.javadoc.failOnError=false \
            -Dgpg.passphrase="${MAVEN_CENTRAL_GPG_PASSPHRASE}"
          python3 - << 'PY'
          import pathlib, shutil
          backup = pathlib.Path('/tmp/pom-backup')
          for src in backup.rglob('pom.xml'):
              shutil.copy2(src, src.relative_to(backup))
          print('restored poms')
          PY

      - name: Create Git tag
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists remotely, skipping tag creation"
          elif git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists locally, pushing to remote"
            git push origin "$TAG"
          else
            echo "Creating new tag $TAG"
            git tag -a "$TAG" -m "Release ${{ github.event.inputs.version }}"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: Release ${{ github.event.inputs.version }}
          body: |
            ## Release ${{ github.event.inputs.version }}
            
            This release includes:
            - All Maven artifacts published to GitHub Packages
            - Tag: ${{ github.event.inputs.release_tag }}
            - Branch: ${{ github.event.inputs.branch_name }}
            
            ### Installation
            
            Add the following to your `pom.xml`:
            
            ```xml
            <repositories>
              <repository>
                <id>github</id>
                <url>https://maven.pkg.github.com/${{ github.repository }}</url>
              </repository>
            </repositories>
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts-${{ github.event.inputs.version }}
          path: |
            **/target/*.jar
            **/target/*.pom
          retention-days: 30
          if-no-files-found: warn

